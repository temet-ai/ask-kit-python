id = "temet.python"
name = "python"
version = "0.1.0"
min_ask_kit = "0.2.0"
requires = ["python3"]
says = "a Python project and its environment as it is now: which Python and which virtualenv it uses and why (.python-version, requires-python, uv.lock, .venv, pyenv, mise), whether uv sync is up to date with the lock, why uv run or an import fails (wrong interpreter, a package missing from the venv, a script that uv never installed, a package that builds from source because no wheel fits this Python), what pyproject.toml declares (scripts, entry points, dependency groups, ruff, mypy and pytest settings), and running the project's pytest, ruff, mypy or pyright and saying what failed; and acting on it (uv sync, add, remove, lock, pin a Python version, ruff --fix, ruff format)"
keywords = ["python", "uv (sync|run|lock|add|remove|venv|python|pip)", "\\buv\\b", "venv", "virtualenv", ".venv", "pytest", "ruff", "mypy", "pyright", "pyproject(\\.toml)?", "pip", "requires-python", "\\.python-version", "uv\\.lock", "pyenv", "ModuleNotFoundError", "ImportError", "wheels?", "site-packages", "dependency groups?"]
route_hint = "a Python project's interpreter, virtualenv, uv sync and lock state, why an import or uv run fails, what pyproject.toml declares, and running its pytest, ruff, mypy or pyright, are python; running any project's test, lint or build commands with JavaScript first (package.json scripts, npm, pnpm, go, make) is tests; which version of a package is installed and why, what is outdated or vulnerable, across ecosystems, and how to call an installed library, is deps; a Rust workspace or cargo is rust; what a repository's checks cost in CI and hooks is checks; where something is defined in the Python code or how it works is code; commits and branches are git"
cite = "a path:line, a pytest node id, a ruff or mypy code, or the file and key in pyproject.toml, .python-version or uv.lock"
instructions = "instructions.md"
acts = [
  "uv sync, lock, add, remove, venv, run, pip install and uninstall, tool install (the virtualenv, uv.lock and pyproject.toml)",
  "uv python install, upgrade, uninstall and pin (installed interpreters and .python-version)",
  "ruff check --fix, ruff check --add-noqa and ruff format (the project's source files)",
  "py.edit of pyproject.toml, ruff.toml, mypy.ini, pytest.ini, setup.cfg, tox.ini, pyrightconfig.json and .python-version",
]

[[settings]]
key = "PY_CHECK_TIMEOUT_SECONDS"
about = "how long one pytest, ruff, mypy or pyright run may take before it is stopped"
default = "300"

[[sources]]
kind = "module"
name = "py"
module = "python.mjs"
api = "api.d.ts"

[[roles]]
name = "environment-doctor"
when = "a question about why uv run, an import, a script or a package install fails, or which Python or virtualenv a project uses"
patterns = ["\\b(ModuleNotFoundError|ImportError|No module named)\\b", "\\bwhy\\b.*\\b(uv|import|venv|virtualenv|interpreter|python)\\b.*\\b(fail|wrong|error|not)\\w*", "\\bwhich python\\b"]
instructions = "roles/environment-doctor.md"

[[roles]]
name = "checker"
when = "a request to run the project's tests, linter or type checker and report what failed, or to fix lint findings"
patterns = ["\\b(run|check|does|do)\\b.*\\b(pytest|ruff|mypy|pyright|tests?)\\b", "\\bruff (fix|format)\\b"]
instructions = "roles/checker.md"
